<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Financial Health by My Simple Health: understand your money, choose what matters, and build toward what matters.">
  <title>Financial Health | My Simple Health</title>
  <script src="js/msh-theme.js"></script>
  <script src="js/msh-routes.js"></script>
  <script src="js/msh-environment.js"></script>
  <link rel="stylesheet" href="css/msh-foundation.css?v=20260830-1">
  <link rel="stylesheet" href="css/msh-app.css">
  <link rel="stylesheet" href="css/msh-environment.css">
  <link rel="stylesheet" href="css/msh-glass-workspace.css">
  <link rel="stylesheet" href="css/msh-financial-health.css?v=20260830-1">
  <link rel="stylesheet" href="css/msh-financial-custom-areas.css?v=20260829-1">
  <link rel="stylesheet" href="css/msh-financial-editor-fix.css?v=20260831-1">
  <link rel="stylesheet" href="css/msh-shared-budget.css?v=20260901-1">
  <link rel="stylesheet" href="css/msh-financial-sharing.css?v=20260901-1">
  <link rel="stylesheet" href="css/msh-mobile-stabilization.css">

</head>
<body class="msh-app-page msh-financial-page" data-msh-page="financial">
  <div class="msh-app-shell">
    <div data-msh-header></div>
    <main class="msh-app-main">
      <section class="msh-financial-world">
        <div class="msh-financial-atmosphere" aria-hidden="true"></div>
        <div class="msh-financial-shell">
          <header class="msh-financial-intro">
            <div class="msh-financial-intro-row">
              <div>
                <p>Financial Health</p>
                <h1>Understand your money.<br>Build toward what matters.</h1>
                <p class="msh-financial-lede">Choose what belongs in your financial picture. Keep the parts of money that matter to your life visible without turning your finances into a score or forcing a standard budget.</p>
              </div>
              <button type="button" class="msh-financial-share-button" data-financial-share aria-label="Share Financial Health">Share</button>
            </div>
            <p class="msh-financial-share-summary" data-financial-share-summary></p>
          </header>
          <nav class="msh-financial-mode-switch" data-financial-mode-switch aria-label="Financial workspace">
            <button type="button" data-financial-mode="personal" aria-pressed="true" aria-current="page">My finances</button>
            <button type="button" data-financial-mode="shared" aria-pressed="false">Shared budget</button>
          </nav>
          <div data-financial-health></div>
          <div data-shared-budget hidden></div>
        </div>
      </section>
    </main>
    <div data-msh-mobile-nav></div>
  </div>
  <script src="js/msh-storage.js"></script>
  <script src="js/msh-shell.js"></script>
<script src="js/msh-financial-health.js?v=20260831-1"></script>

  <script src="js/msh-financial-sharing.js?v=20260901-1"></script>
</body>
</html>
