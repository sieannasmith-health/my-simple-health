name: MySimpleHealth
options:
  bundleIdPrefix: org.mysimplehealth
  deploymentTarget:
    iOS: "17.0"
packages:
  MySimpleHealthHealthKit:
    path: ../MySimpleHealthHealthKit
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.2.0
targets:
  MySimpleHealth:
    type: application
    platform: iOS
    sources: [App]
    configFiles:
      Debug: Config/Debug.xcconfig
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.mysimplehealth.app
        DEVELOPMENT_TEAM: 736NRP69T9
        CODE_SIGN_ENTITLEMENTS: App/MySimpleHealth.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 6.0
        OTHER_LDFLAGS: $(inherited) -ObjC
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          INFOPLIST_FILE: App/Info-Debug.plist
          ONLY_ACTIVE_ARCH: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: My Simple Health
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: Google OAuth
            CFBundleURLSchemes:
              - com.googleusercontent.apps.962838363677-6njo5buhrcn9ne6mbgb8pubehbgnnbtb
        NSHealthShareUsageDescription: My Simple Health uses health information you choose to share from Apple Health to help bring your activity, sleep, and other health information together in My Health.
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: MySimpleHealthHealthKit
        product: MSHHealthCore
      - package: MySimpleHealthHealthKit
        product: MSHAppleHealthKit
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: GoogleSignIn
        product: GoogleSignIn
  MySimpleHealthTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MySimpleHealth
schemes:
  MySimpleHealth:
    build:
      targets:
        MySimpleHealth: all
        MySimpleHealthTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MySimpleHealthTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
