name: MySimpleHealth
options:
  bundleIdPrefix: org.mysimplehealth
  deploymentTarget:
    iOS: "17.0"
packages:
  MySimpleHealthHealthKit:
    path: ../MySimpleHealthHealthKit
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.54.1
targets:
  MySimpleHealth:
    type: application
    platform: iOS
    sources: [App]
    configFiles:
      Debug: Config/Debug.xcconfig
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.mysimplehealth.app
        DEVELOPMENT_TEAM: 736NRP69T9
        CODE_SIGN_ENTITLEMENTS: App/MySimpleHealth.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 6.0
      configs:
        Debug:
          INFOPLIST_FILE: App/Info-Debug.plist
          ONLY_ACTIVE_ARCH: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: My Simple Health
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: MSH Auth
            CFBundleURLSchemes:
              - mysimplehealth
        NSHealthShareUsageDescription: My Simple Health uses health information you choose to share from Apple Health to help bring your activity, sleep, and other health information together in My Health.
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: MySimpleHealthHealthKit
        product: MSHHealthCore
      - package: MySimpleHealthHealthKit
        product: MSHAppleHealthKit
      - package: Supabase
        product: Supabase
  MySimpleHealthTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MySimpleHealth
schemes:
  MySimpleHealth:
    build:
      targets:
        MySimpleHealth: all
        MySimpleHealthTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MySimpleHealthTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
