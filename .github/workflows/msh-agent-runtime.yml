name: MSH Agent Runtime
run-name: MSH Agent Runtime • #${{ inputs.issue_number }} • ${{ inputs.agent }}

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number to run
        required: true
        type: string
      agent:
        description: Agent key (nomy, selah, tessa, mira, ellis, iris, reese, genesis)
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AGENT_MODEL: ${{ vars.MSH_AGENT_MODEL || 'gpt-5.6-luna' }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Resolve issue and agent
        id: route
        shell: bash
        env:
          DISPATCH_ISSUE: ${{ inputs.issue_number }}
          DISPATCH_AGENT: ${{ inputs.agent }}
        run: |
          issue="$DISPATCH_ISSUE"
          agent="$DISPATCH_AGENT"

          if [ -z "$issue" ] || [ -z "$agent" ]; then
            echo "Unable to resolve issue/agent from evaluator dispatch." >&2
            exit 1
          fi

          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "agent=$agent" >> "$GITHUB_OUTPUT"

      - name: Confirm Node runtime
        run: node --version

      - name: Run MSH specialist agent
        env:
          ISSUE_NUMBER: ${{ steps.route.outputs.issue }}
          AGENT_NAME: ${{ steps.route.outputs.agent }}
        run: node agent-runtime/run-v2.mjs
