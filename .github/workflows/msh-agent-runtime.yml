name: MSH Agent Runtime

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number to run
        required: true
        type: string
      agent:
        description: Agent key (nomy, selah, tessa, mira, ellis, iris, reese, genesis)
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  run-agent:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && startsWith(github.event.label.name, 'agent:')) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request && startsWith(github.event.comment.body, 'RUN AGENT:'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AGENT_MODEL: ${{ vars.MSH_AGENT_MODEL || 'gpt-5.6-luna' }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve issue and agent
        id: route
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "issue=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
            echo "agent=${{ inputs.agent }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "issues" ]; then
            echo "issue=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            echo "agent=${{ github.event.label.name }}" | sed 's/agent://' | sed 's/^/agent=/' >> "$GITHUB_OUTPUT"
          else
            echo "issue=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            echo "${{ github.event.comment.body }}" | sed -n '1s/^RUN AGENT:[[:space:]]*//p' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z].*$//' | sed 's/^/agent=/' >> "$GITHUB_OUTPUT"
          fi

      - name: Run MSH specialist agent
        env:
          ISSUE_NUMBER: ${{ steps.route.outputs.issue }}
          AGENT_NAME: ${{ steps.route.outputs.agent }}
        run: node agent-runtime/run.mjs
