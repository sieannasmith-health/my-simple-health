name: MSH Agent Runtime

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number to run
        required: true
        type: string
      agent:
        description: Agent key (nomy, selah, tessa, mira, ellis, iris, reese, genesis)
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run-agent:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && startsWith(github.event.label.name, 'agent:')) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request && startsWith(github.event.comment.body, 'RUN AGENT:'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AGENT_MODEL: ${{ vars.MSH_AGENT_MODEL || 'gpt-5.6-luna' }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Resolve issue and agent
        id: route
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ISSUE: ${{ inputs.issue_number }}
          DISPATCH_AGENT: ${{ inputs.agent }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          EVENT_LABEL: ${{ github.event.label.name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            issue="$DISPATCH_ISSUE"
            agent="$DISPATCH_AGENT"
          elif [ "$EVENT_NAME" = "issues" ]; then
            issue="$EVENT_ISSUE"
            agent="${EVENT_LABEL#agent:}"
          else
            issue="$EVENT_ISSUE"
            agent="$(printf '%s' "$COMMENT_BODY" | sed -n '1s/^RUN AGENT:[[:space:]]*//p' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z].*$//')"
          fi

          if [ -z "$issue" ] || [ -z "$agent" ]; then
            echo "Unable to resolve issue/agent from event." >&2
            exit 1
          fi

          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "agent=$agent" >> "$GITHUB_OUTPUT"

      - name: Confirm Node runtime
        run: node --version

      - name: Run MSH specialist agent
        env:
          ISSUE_NUMBER: ${{ steps.route.outputs.issue }}
          AGENT_NAME: ${{ steps.route.outputs.agent }}
        run: node agent-runtime/run-v2.mjs
