name: MSH Mac Xcode Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msh-mac-xcode-worker
  cancel-in-progress: false

jobs:
  verify-mac-xcode-worker:
    name: Verify MSH Mac → XcodeBuildMCP → Xcode
    runs-on: [self-hosted, macOS, ARM64, msh-xcode]
    timeout-minutes: 10
    env:
      MSH_WORKSPACE: /Users/sieannasmith/Documents/my-simple-health
      PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4

      - name: Verify runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          uname -a

      - name: Verify Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version

      - name: Verify XcodeBuildMCP installation
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodebuildmcp
          xcodebuildmcp --version

      - name: Verify configured MSH workspace
        shell: bash
        run: |
          set -euo pipefail
          test -d "$MSH_WORKSPACE"
          test -f "$MSH_WORKSPACE/.xcodebuildmcp/config.yaml"
          echo "workspace=$MSH_WORKSPACE"

      - name: Ensure Xcode is available to IDE bridge
        shell: bash
        run: |
          set -euo pipefail
          if ! pgrep -x Xcode >/dev/null 2>&1; then
            open -a Xcode
            sleep 10
          fi
          pgrep -x Xcode >/dev/null

      - name: Query XcodeBuildMCP IDE bridge
        working-directory: /Users/sieannasmith/Documents/my-simple-health
        shell: bash
        run: |
          set -euo pipefail
          xcodebuildmcp xcode-ide bridge-status
          xcodebuildmcp xcode-ide list-tools

      - name: Worker verification summary
        shell: bash
        run: |
          {
            echo "## MSH Mac Xcode worker verification"
            echo ""
            echo "- Runner: $RUNNER_NAME"
            echo "- OS: $RUNNER_OS"
            echo "- Architecture: $RUNNER_ARCH"
            echo "- Xcode: available"
            echo "- XcodeBuildMCP: available"
            echo "- IDE bridge query: completed"
          } >> "$GITHUB_STEP_SUMMARY"
