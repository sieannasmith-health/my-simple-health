name: MSH Cloud Xcode Worker

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Controlled worker operation
        required: true
        default: native-test
        type: choice
        options:
          - verify
          - native-test
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/msh-mac-xcode-worker.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'

permissions:
  contents: read

concurrency:
  group: msh-cloud-xcode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud-xcode-worker:
    name: MSH Cloud macOS Xcode tests
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4

      - name: Verify cloud runner and Xcode
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          uname -a
          xcode-select -p
          xcodebuild -version

      - name: Verify checked-out MSH workspace
        shell: bash
        run: |
          set -euo pipefail
          test -d "$GITHUB_WORKSPACE/ios/MySimpleHealthApp"
          test -d "$GITHUB_WORKSPACE/ios/MySimpleHealthHealthKit"

      - name: Verify local HealthKit package
        if: ${{ inputs.operation != 'verify' }}
        working-directory: ios/MySimpleHealthHealthKit
        shell: bash
        run: |
          set -euo pipefail
          test -f Package.swift
          swift package describe

      - name: Install XcodeGen
        if: ${{ inputs.operation != 'verify' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Regenerate Xcode project
        if: ${{ inputs.operation != 'verify' }}
        working-directory: ios/MySimpleHealthApp
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Select available iPhone simulator
        if: ${{ inputs.operation != 'verify' }}
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_UDID="$(python3 - <<'PY'
          import json
          import subprocess
          payload = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          candidates = []
          for runtime, devices in payload.get('devices', {}).items():
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  name = device.get('name', '')
                  udid = device.get('udid')
                  if device.get('isAvailable') and udid and name.startswith('iPhone'):
                      candidates.append((name, udid))
          if not candidates:
              raise SystemExit('No available iPhone simulator found on GitHub-hosted runner')
          candidates.sort(reverse=True)
          print(candidates[0][1])
          PY
          )"
          echo "udid=$SIMULATOR_UDID" >> "$GITHUB_OUTPUT"

      - name: Run MySimpleHealth native unit tests
        if: ${{ inputs.operation != 'verify' }}
        working-directory: ios/MySimpleHealthApp
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/MSHNativeTests.xcresult"
          xcodebuild \
            -project MySimpleHealth.xcodeproj \
            -scheme MySimpleHealth \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -configuration Debug \
            -resultBundlePath "$RUNNER_TEMP/MSHNativeTests.xcresult" \
            test CODE_SIGNING_ALLOWED=NO

      - name: Upload native test result bundle
        if: ${{ always() && inputs.operation != 'verify' }}
        uses: actions/upload-artifact@v4
        with:
          name: msh-native-test-xcresult
          path: ${{ runner.temp }}/MSHNativeTests.xcresult
          if-no-files-found: warn
          retention-days: 7

      - name: Worker summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## MSH Cloud Xcode worker"
            echo ""
            echo "- Runner: $RUNNER_NAME"
            echo "- OS: $RUNNER_OS"
            echo "- Architecture: $RUNNER_ARCH"
            echo "- Commit: $GITHUB_SHA"
            echo "- Xcode: cloud-hosted"
            echo "- Laptop dependency: none"
          } >> "$GITHUB_STEP_SUMMARY"
