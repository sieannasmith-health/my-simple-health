name: One-time Whole Health copy update

on:
  push:
    paths:
      - '.github/workflows/one-time-whole-health-copy.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace Whole Health story copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          old = "Health doesn't happen in separate boxes. See the parts of your health and life together, in the context of you."
          new = "See how the pieces of your health connect, so the whole picture makes more sense."
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one old-copy match, found {count}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit copy update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine Whole Health story copy"
          git push origin HEAD:main
