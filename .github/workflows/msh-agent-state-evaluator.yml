name: MSH Agent State Evaluator
run-name: >-
  ${{ github.event_name == 'repository_dispatch'
      && format('MSH Watchdog Sweep • {0}', github.event.client_payload.correlation_id)
      || format('MSH Agent State Evaluator • {0}', github.event.issue.number || inputs.issue_number || github.run_id) }}

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number to evaluate
        required: true
        type: string
  repository_dispatch:
    types: [msh-watchdog-sweep]
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: msh-agent-state-${{ github.event.issue.number || inputs.issue_number || github.event.client_payload.correlation_id || github.run_id }}
  cancel-in-progress: false

jobs:
  evaluate-one:
    if: github.event_name != 'schedule' && github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
      AGENT_TURN_WORKFLOW: msh-agent-runtime.yml
      AGENT_TURN_REF: main
      AGENT_LEASE_MINUTES: '20'
      AGENT_MAX_RETRIES: '3'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Resolve issue
        id: issue
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ISSUE: ${{ inputs.issue_number }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then issue="$DISPATCH_ISSUE"; else issue="$EVENT_ISSUE"; fi
          test -n "$issue"
          echo "number=$issue" >> "$GITHUB_OUTPUT"
      - name: Recover legacy blocked state when actionable
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          MSH_INLINE_EVALUATOR: '1'
        run: node agent-runtime/recovery-redrive-bootstrap.mjs
      - name: Evaluate durable task state
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: node agent-runtime/state-evaluator.mjs

  watchdog:
    if: github.event_name == 'schedule' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - name: Discover stale actionable issues and dispatch serialized evaluations
        shell: bash
        run: |
          gh issue list --state open --limit 100 --json number,labels,body --jq '
            .[]
            | select(
                any(.labels[]?; .name | startswith("agent:"))
                or ((.body // "") | contains("<!-- MSH_STATE_LOCK -->"))
                or (((.body // "") | test("(?m)^## Owner\\s*$")) and ((.body // "") | test("(?m)^- Responsible:\\s*[A-Za-z][A-Za-z0-9_-]*\\s*/")))
              )
            | .number
          ' > /tmp/issues
          while read -r issue; do
            [ -z "$issue" ] && continue
            echo "Dispatching serialized evaluator for issue #$issue"
            gh workflow run msh-agent-state-evaluator.yml --ref main -f issue_number="$issue"
          done < /tmp/issues
