name: HelloSimple Contract

on:
  pull_request:
    paths:
      - 'hellosimple/**'
      - 'tests/hellosimple-*.test.mjs'
      - '.github/workflows/hellosimple-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: HelloSimple contract tests
        run: node --test tests/hellosimple-*.test.mjs
