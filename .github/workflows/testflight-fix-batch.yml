name: TestFlight Fix Batch

on:
  push:
    branches:
      - selah/testflight-fix-batch-250-252
    paths:
      - .github/workflows/testflight-fix-batch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused TestFlight fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ios/MySimpleHealthApp/App/MSHMyHealthHomeScreen.swift')
          text = path.read_text()

          old = '@State private var isEnvironmentPresented = false\n    @State private var personalEnvironmentImage: UIImage?'
          new = '@State private var isEnvironmentPresented = false\n    @State private var isSimplePresented = false\n    @State private var personalEnvironmentImage: UIImage?'
          assert old in text
          text = text.replace(old, new, 1)

          old = '                action: {}\n            ) {\n                HStack(spacing: 8) {\n                    Text("Ask Simple")'
          new = '                action: { isSimplePresented = true }\n            ) {\n                HStack(spacing: 8) {\n                    Text("Ask Simple")'
          assert old in text
          text = text.replace(old, new, 1)

          anchor = '        .sheet(isPresented: $isEnvironmentPresented) {\n            MSHDigitalEnvironmentSheet('
          assert anchor in text
          # Add a second sheet after the existing environment sheet closes, immediately before the accessibility modifier.
          marker = '        }\n        .accessibilityIdentifier("my-health-home")'
          replacement = '''        }\n        .sheet(isPresented: $isSimplePresented) {\n            NavigationStack {\n                ZStack {\n                    MSHColor.canvas.ignoresSafeArea()\n                    MSHWebView(route: MSHWebRoute(rawValue: "hello.html")!)\n                }\n                .navigationTitle("Simple")\n                .navigationBarTitleDisplayMode(.inline)\n            }\n        }\n        .accessibilityIdentifier("my-health-home")'''
          assert marker in text
          text = text.replace(marker, replacement, 1)

          old = '                        Text("View all insights →").font(.caption)'
          new = '''                        NavigationLink {\n                            MSHImmediateDestination(title: "All Insights") {\n                                MSHMyHealthScreen(viewModel: viewModel)\n                            }\n                        } label: {\n                            Text("View all insights →").font(.caption)\n                        }\n                        .buttonStyle(.plain)\n                        .accessibilityLabel("View all insights")\n                        .accessibilityIdentifier("view-all-insights")'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '.background(shape.fill(isPlainEnvironment ? Color.white.opacity(0.14) : Color.black.opacity(0.045)))'
          new = '.background(shape.fill(isPlainEnvironment ? Color.white.opacity(0.14) : Color.black.opacity(0.46)))'
          assert old in text
          text = text.replace(old, new, 1)

          old = '                edgeStrength: isPlainEnvironment ? 0.34 : 0.46,\n                shadowStrength: isPlainEnvironment ? 0.16 : 0.30,\n                glowStrength: isPlainEnvironment ? 0.01 : 0.06'
          new = '                edgeStrength: isPlainEnvironment ? 0.34 : 0.68,\n                shadowStrength: isPlainEnvironment ? 0.16 : 0.42,\n                glowStrength: isPlainEnvironment ? 0.01 : 0.04'
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('server/hello.js')
          text = path.read_text()
          old = 'Use only context that is relevant to the current message. Do not dump, summarize, or announce context merely because it is available.\n\nBefore asking the person to identify, paste, or describe what they are viewing, check whether the current activity or page context already identifies it.'
          new = '''Use only context that is relevant to the current message. Do not dump, summarize, or announce context merely because it is available.\n\nTreat a short correction or clarification as an update to the immediately preceding unresolved referent. If the current message resolves a question you just asked, accept that clarification as conversational state, do not ask the same question again, and do not repeat the prior explanation. Advance to the next useful answer, action, or single high-value follow-up. Avoid near-duplicate consecutive responses unless the person explicitly asks you to repeat or restate something.\n\nBefore asking the person to identify, paste, or describe what they are viewing, check whether the current activity or page context already identifies it.'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Add regression contract test
        run: |
          cat > tests/hello-clarification-continuity.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          test('Hello prompt advances after a resolved clarification instead of repeating', () => {
            const source = readFileSync(new URL('../server/hello.js', import.meta.url), 'utf8');
            assert.match(source, /Treat a short correction or clarification as an update/);
            assert.match(source, /do not ask the same question again/);
            assert.match(source, /do not repeat the prior explanation/);
            assert.match(source, /Avoid near-duplicate consecutive responses/);
          });
          EOF

      - name: Commit fixes
        run: |
          git add ios/MySimpleHealthApp/App/MSHMyHealthHomeScreen.swift server/hello.js tests/hello-clarification-continuity.test.mjs
          git config user.name "msh-testflight-fixer"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Fix first TestFlight QA findings"
          git push origin HEAD:selah/testflight-fix-batch-250-252
