name: MSH Agent Runtime Structural Test

on:
  pull_request:
    paths:
      - 'agent-runtime/**'
      - '.github/workflows/msh-agent-runtime.yml'
      - '.github/workflows/msh-agent-state-evaluator.yml'
      - '.github/workflows/msh-agent-orphan-e2e.yml'
      - '.github/workflows/msh-agent-runtime-structural-test.yml'

permissions:
  contents: read

jobs:
  null-pr-evidence-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Confirm Node 24 runtime
        run: node --version
      - name: Check runtime syntax
        run: |
          node --check agent-runtime/run-v2.mjs
          node --check agent-runtime/run-v3.mjs
          node --check agent-runtime/state-hydrated-runner.mjs
          node --check agent-runtime/evidence-resolver.mjs
          node --check agent-runtime/engineering-execution.mjs
          node --check agent-runtime/maintenance-authorization.mjs
          node --check agent-runtime/maintenance-cleanup.mjs
          node --check agent-runtime/state-evaluator.mjs
          node --check agent-runtime/human-gate-normalizer.mjs
          node --check agent-runtime/orchestration-policy.mjs
          node --check agent-runtime/post-turn-reconciler.mjs
          node --check agent-runtime/runtime-preflight-guard.mjs
          node --check agent-runtime/livelock-policy.mjs
          node --check agent-runtime/turn-transition.mjs
          node --check agent-runtime/runtime-context-hydration.mjs
          node --check agent-runtime/everyone-fanout.mjs
          node --check agent-runtime/langgraph-worker-bridge.mjs
      - name: Verify null PR recovery
        run: node agent-runtime/tests/evidence-resolver.test.mjs
      - name: Verify routing guard regressions
        run: node agent-runtime/tests/routing-guards.test.mjs
      - name: Verify orchestration authority policy
        run: node agent-runtime/tests/orchestration-policy.test.mjs
      - name: Verify lifecycle exit boundary
        run: node agent-runtime/tests/lifecycle-exit-boundary.test.mjs
      - name: Verify blind watchdog E2E contract
        run: node agent-runtime/tests/orphan-e2e-contract.test.mjs
      - name: Verify runtime maintenance authorization security
        run: node agent-runtime/tests/maintenance-authorization.test.mjs
      - name: Verify runtime failure safety
        run: node agent-runtime/tests/runtime-failure-safety.test.mjs
      - name: Verify reconciliation authority and livelock boundary
        run: node agent-runtime/tests/reconciliation-authority-livelock-boundary.test.mjs
      - name: Verify P0 autonomy context and Everyone join semantics
        run: node agent-runtime/tests/p0-autonomy-context.test.mjs

  langgraph-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: agent-runtime/langgraph
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install bounded LangGraph migration dependencies
        run: pip install -r agent-runtime/langgraph/requirements.txt pytest
      - name: Verify LangGraph adapter and controller conformance
        run: python -m pytest -q agent-runtime/langgraph
