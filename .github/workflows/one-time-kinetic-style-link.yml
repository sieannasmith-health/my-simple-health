name: One-time kinetic stylesheet wiring

on:
  push:
    paths:
      - '.github/workflows/one-time-kinetic-style-link.yml'

permissions:
  contents: write

jobs:
  wire-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wire kinetic stylesheet
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/msh-product-demo-timeline.js')
          s = p.read_text()
          marker = "const mobile = window.matchMedia('(max-width: 560px)');"
          insert = """const mobile = window.matchMedia('(max-width: 560px)');\n\n  function ensureKineticStyles() {\n    if (document.querySelector('link[data-msh-kinetic-styles]')) return;\n    const link = document.createElement('link');\n    link.rel = 'stylesheet';\n    link.href = 'css/msh-product-story-kinetic.css';\n    link.dataset.mshKineticStyles = 'true';\n    document.head.appendChild(link);\n  }"""
          if 'function ensureKineticStyles()' not in s:
              if marker not in s:
                  raise SystemExit('mobile marker not found')
              s = s.replace(marker, insert, 1)
          boot_marker = "function boot() {\n    renderTimeStory();"
          boot_replacement = "function boot() {\n    ensureKineticStyles();\n    renderTimeStory();"
          if 'ensureKineticStyles();\n    renderTimeStory();' not in s:
              if boot_marker not in s:
                  raise SystemExit('boot marker not found')
              s = s.replace(boot_marker, boot_replacement, 1)
          p.write_text(s)
          PY
      - name: Commit wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/msh-product-demo-timeline.js
          git commit -m "Wire kinetic product story stylesheet" || exit 0
          git push origin HEAD:main
