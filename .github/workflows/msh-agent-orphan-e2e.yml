name: MSH Agent Orphan Discovery E2E

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  unattended-orphan-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Create synthetic orphan objective
        id: issue
        shell: bash
        run: |
          body=$(cat <<'EOF'
          ## Objective
          Verify unattended orphan discovery through the deployed MSH watchdog sweep.

          ## Owner
          - Responsible: Selah / Engineering
          - Accountable: Nomy / Product

          ## Test constraint
          This is a synthetic orchestration validation issue. Do not modify repository code. The test is successful once the watchdog discovers this issue, initializes durable state, and dispatches Selah without issue-specific input.
          EOF
          )

          url=$(gh issue create --repo "$REPO" --title "[MSH-TEST] Unattended orphan discovery" --body "$body")
          number=${url##*/}
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Created synthetic orphan #$number"

      - name: Assert pristine orphan baseline
        shell: bash
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          issue=$(gh api "repos/$REPO/issues/$ISSUE_NUMBER")
          echo "$issue" | jq -e '[.labels[].name] | all(startswith("agent:") or startswith("status:"); not)' >/dev/null
          echo "$issue" | jq -e '.body | contains("<!-- MSH_STATE_LOCK -->") | not' >/dev/null

      - name: Trigger blind repository-wide watchdog sweep
        shell: bash
        run: |
          gh api --method POST "repos/$REPO/dispatches" -f event_type='msh-watchdog-sweep'

      - name: Wait only for watchdog-produced evidence
        shell: bash
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          deadline=$((SECONDS + 180))
          while [ $SECONDS -lt $deadline ]; do
            issue=$(gh api "repos/$REPO/issues/$ISSUE_NUMBER")
            body=$(echo "$issue" | jq -r '.body // ""')
            labels=$(echo "$issue" | jq -r '[.labels[].name] | join(" ")')

            run=$(gh run list --repo "$REPO" --workflow msh-agent-runtime.yml --limit 50 --json databaseId,displayTitle,status,conclusion,createdAt \
              --jq ".[] | select(.displayTitle == \"MSH Agent Runtime • #$ISSUE_NUMBER • selah\") | @json" | head -n 1)

            if [[ "$body" == *'<!-- MSH_STATE_LOCK -->'* ]] && [[ "$labels" == *'agent:selah'* ]] && [ -n "$run" ]; then
              echo "Observed durable state, Selah assignment, and correlated bounded-turn dispatch."
              echo "$run"
              exit 0
            fi

            sleep 5
          done

          echo "Timed out waiting for unattended watchdog discovery evidence." >&2
          gh api "repos/$REPO/issues/$ISSUE_NUMBER" | jq '{labels: [.labels[].name], body: .body}' >&2
          gh run list --repo "$REPO" --workflow msh-agent-runtime.yml --limit 20 --json databaseId,displayTitle,status,conclusion,createdAt >&2
          exit 1

      - name: Assert no false Siea escalation
        shell: bash
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          sleep 15
          issue=$(gh api "repos/$REPO/issues/$ISSUE_NUMBER")
          echo "$issue" | jq -e '[.labels[].name] | index("needs:siea") | not' >/dev/null

      - name: Close synthetic issue
        if: always()
        shell: bash
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "$REPO" --comment "Synthetic unattended orphan-discovery validation complete." || true
          fi
