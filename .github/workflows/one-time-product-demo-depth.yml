name: One-time product demo depth update

# Triggered once to install the SVG timeline and depth treatment.
on:
  push:
    paths:
      - '.github/workflows/one-time-product-demo-depth.yml'

permissions:
  contents: write

jobs:
  update-product-story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add product story SVG and floating depth styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          html = index_path.read_text()
          script = '<script src="js/msh-product-demo-timeline.js"></script>'
          if script not in html:
              needle = '</body>'
              if needle not in html:
                  raise SystemExit('Could not find closing body tag in index.html')
              html = html.replace(needle, script + needle, 1)
              index_path.write_text(html)
          PY
      - name: Commit product story update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load SVG health timeline" || exit 0
          git push origin HEAD:main
