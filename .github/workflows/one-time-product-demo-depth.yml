name: One-time product demo depth update

on:
  push:
    paths:
      - '.github/workflows/one-time-product-demo-depth.yml'

permissions:
  contents: write

jobs:
  update-product-story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add product story SVG and floating depth styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('css/msh-product-demo.css')
          css = css_path.read_text()
          marker = '/* MSH floating glass depth + story 02 SVG */'
          if marker not in css:
              css += r'''

/* MSH floating glass depth + story 02 SVG */
.product-demo{
  background:rgba(255,255,255,.66);
  -webkit-backdrop-filter:blur(22px) saturate(118%);
  backdrop-filter:blur(22px) saturate(118%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.76),0 28px 80px rgba(23,61,43,.14),0 8px 26px rgba(23,61,43,.08);
}
.demo-visual{
  border:1px solid rgba(255,255,255,.58);
  background:linear-gradient(135deg,rgba(255,255,255,.56),rgba(245,241,231,.34));
  -webkit-backdrop-filter:blur(20px) saturate(118%);
  backdrop-filter:blur(20px) saturate(118%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.78),0 20px 54px rgba(23,61,43,.11),0 6px 18px rgba(23,61,43,.06);
}
.demo-doorways a,.demo-event,.discovery-lines span,.discovery-insight,.practice-step,.journey-sources span,.trust-strip,.trust-principle-button{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.72),0 14px 34px rgba(23,61,43,.09),0 4px 12px rgba(23,61,43,.05);
  -webkit-backdrop-filter:blur(16px) saturate(112%);
  backdrop-filter:blur(16px) saturate(112%);
}
.demo-doorways a:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.88),0 20px 42px rgba(23,61,43,.13),0 7px 18px rgba(23,61,43,.07)}

.demo-visual--timeline-svg{display:grid;place-items:center;padding:8px;overflow:hidden}
.time-story-svg{display:block;width:100%;height:auto;min-height:300px;overflow:visible}
.time-context-window{fill:rgba(255,255,255,.26);stroke:rgba(125,148,96,.13);stroke-width:1}
.time-flow{fill:none;stroke:rgba(23,61,43,.22);stroke-width:1.5;stroke-linecap:round}
.time-stem{fill:none;stroke:rgba(23,61,43,.18);stroke-width:1.25;stroke-linecap:round;stroke-dasharray:3 5}
.time-point{fill:#7d9460;stroke:#fff;stroke-width:3}
.time-point--focus{fill:#173d2b}
.time-focus-ring{fill:none;stroke:rgba(23,61,43,.18);stroke-width:1.5}
.time-card{fill:rgba(255,255,255,.88);stroke:rgba(23,61,43,.10);stroke-width:1}
.time-card--strong{fill:rgba(245,248,240,.94)}
.time-card--focus{fill:rgba(238,244,235,.96);stroke:rgba(23,61,43,.18)}
.time-card-label{font:600 12px Arial,sans-serif;fill:#252822;text-anchor:middle}
.time-focus-label{font:700 9px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;fill:#6f8656;text-anchor:middle}
.time-days text{font:10px Arial,sans-serif;fill:#596159;text-anchor:middle}
.time-event{transform-box:fill-box;transform-origin:center;animation:time-story-settle 7s ease-in-out infinite}
.time-event-2{animation-delay:-1.1s}.time-event-3{animation-delay:-2.2s}.time-event-4{animation-delay:-3.3s}.time-event-5{animation-delay:-4.4s}
@keyframes time-story-settle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media(max-width:520px){.demo-visual--timeline-svg{padding:0}.time-story-svg{min-height:330px}.time-card-label{font-size:11px}.time-focus-label{font-size:8px}}
@media(prefers-reduced-motion:reduce){.time-event{animation:none}}
'''
              css_path.write_text(css)

          index_path = Path('index.html')
          html = index_path.read_text()
          script = '<script src="js/msh-product-demo-timeline.js"></script>'
          if script not in html:
              needle = '</body>'
              if needle not in html:
                  raise SystemExit('Could not find closing body tag in index.html')
              html = html.replace(needle, script + needle, 1)
              index_path.write_text(html)
          PY
      - name: Commit product story update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/msh-product-demo.css index.html
          git commit -m "Add floating depth and SVG health timeline" || exit 0
          git push origin HEAD:main
